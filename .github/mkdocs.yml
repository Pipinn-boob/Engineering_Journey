# MkDocs configuration — publishes this repository as a documentation site.
# Build locally with:  mkdocs serve -f .github/mkdocs.yml   (http://localhost:8000)
# The config lives in .github/ because MkDocs >= 1.6 requires the docs
# directory to not contain the config file, and the repository root is the
# docs directory — one single source of truth for GitHub and the site.
# The whole repository is the docs directory, so every note, lab and project
# README becomes a site page automatically.

site_name: Engineering Journey
site_description: >-
  Crispin Ngande Murimi's learning notes, labs, and projects —
  networking, Linux, Python, and cybersecurity, learned in public.
site_url: https://pipinn-boob.github.io/Engineering_Journey/
repo_url: https://github.com/Pipinn-boob/Engineering_Journey
repo_name: Pipinn-boob/Engineering_Journey
edit_uri: edit/main/

# The repository root is the docs source; hide build internals from the site.
docs_dir: ..
site_dir: ../site

exclude_docs: |
  /mkdocs.yml
  /README.md
  __pycache__/
  .pytest_cache/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Home: index.md
  - Notes:
      - Networking basics: networking_basics/README.md
      - Linux basics: notes/linux_basics/README.md
  - Projects:
      - Subnet calculator: projects/subnet-calculator/README.md
  - Labs:
      - Lab plan (Wireshark & Packet Tracer): labs/README.md
  - Certifications: certifications/README.md
  - Learning docs:
      - Skills matrix: docs/skills-matrix.md
      - Interview prep: docs/interview-prep.md
      - 90-day plan: docs/90-day-plan.md
      - Profile README draft: docs/profile-readme.md
      - Résumé template: docs/resume-template.md
      - Target companies: docs/target-companies.md
      - How I work (CONTRIBUTING): CONTRIBUTING.md
